name: Deploy Frontend (CI gate)

# The actual production deploy is handled by Vercel's native GitHub
# integration (Root Directory = frontend/, see README): every push to master
# triggers a deploy automatically, no job needed here. This workflow only
# runs lint + build as a CI gate to catch errors before Vercel attempts to
# build.
on:
  push:
    branches: [master]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Alternative if you ever want to decouple the deploy from Vercel's native
  # integration (e.g. to explicitly control ordering against the CI gate
  # above). Requires the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
  # secrets.
